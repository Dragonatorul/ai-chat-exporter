<div data-test-render-count="1">
  <div class="font-large !font-user-message grid grid-cols-1 gap-2 py-0.5 relative" data-testid="user-message">
    <p class="whitespace-pre-wrap break-words">Sample user prompt text.</p>
  </div>

  <div class="font-claude-response relative leading-[1.65rem]">
    <div>
      <div class="standard-markdown grid-cols-1 grid [&_>_*]:min-w-0 gap-3">
        <p class="font-claude-response-body break-words whitespace-normal leading-[1.7]">
          Sample assistant response text.
        </p>
      </div>
    </div>

    <button aria-label="Preview contents" class="flex text-left font-ui rounded-lg overflow-hidden border-0.5 transition duration-300 w-full hover:bg-bg-000/50 px-4">
      <div class="artifact-block-cell group/artifact-block flex flex-1 align-start justify-between w-full">
        <div class="flex flex-col gap-1 py-4 px-4">
          <div class="leading-tight text-sm">Sample Artifact Document</div>
          <div class="text-sm text-text-300 opacity-100 transition-opacity duration-200">Document</div>
        </div>
        <div class="artifact-block-cell-preview relative">
          <div class="absolute right-2 flex flex-1 overflow-hidden w-[52px] h-[71px] rounded-t-lg border-0.5 border-border-200 select-none">
            # Artifact preview text
          </div>
        </div>
      </div>
    </button>

    <div id="markdown-artifact" class="font-claude-response mx-auto w-full max-w-3xl leading-[1.65rem] px-6 pt-4 md:pt-6 md:px-11">
      <h1>Sample Artifact Full Content</h1>
      <p>Expanded artifact body used by exporter full-artifact extraction.</p>
    </div>

    <div class="ai-exporter-markdown-artifact" style="display: none;">
      <h1>Sample Artifact Full Content</h1>
      <p>Cached artifact content copied from #markdown-artifact before export.</p>
    </div>
  </div>
</div>
